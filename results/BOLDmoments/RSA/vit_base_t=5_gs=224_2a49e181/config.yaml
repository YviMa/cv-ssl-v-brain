    agg_frames: null
    pick_frames: 5
  layers:
  - backbone.blocks.1
  - backbone.blocks.2
  - backbone.blocks.3
  - backbone.blocks.4
  - backbone.blocks.5
  - backbone.blocks.6
  - backbone.blocks.7
  - backbone.blocks.8
  - backbone.blocks.9
  - backbone.blocks.10
  - backbone.blocks.11
model:
  center_crop: false
  crop_size: 224
  name: vit_base
  netset: cv_ssl
  time_window: 5
