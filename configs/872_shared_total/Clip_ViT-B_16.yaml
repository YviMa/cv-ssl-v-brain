data:
    data_dir: "../../data/Algonauts23_shared_Net2Brain"
    stimuli_path: "../../data/Algonauts23_shared_Net2Brain/images"
    brain_rdms: "../../data/Algonauts23_shared_Net2Brain/brain_data"
    results_dir: "results/872_shared_total/"
    category: None

model:
    netset: "Clip"
    directory: "tmp/models/"
    name: "ViT-B/16"
    time_window: None 
    crop_size: None 
    center_crop: None 

feature_extraction:
    layers:
        - "visual.transformer.resblocks.1"
        - "visual.transformer.resblocks.2"
        - "visual.transformer.resblocks.3"
        - "visual.transformer.resblocks.4"
        - "visual.transformer.resblocks.5"
        - "visual.transformer.resblocks.6"
        - "visual.transformer.resblocks.7"
        - "visual.transformer.resblocks.8"
        - "visual.transformer.resblocks.9"
        - "visual.transformer.resblocks.10"
        - "visual.transformer.resblocks.11"

analysis:
    rsa:
        execute: True
        distance_metric: "spearman"
    reg: 
        execute: True
        n_folds: 3 # stick to net2brain defaults for now
        n_components: 100
        trn_tst_split: 0.8
        batch_size: 100


