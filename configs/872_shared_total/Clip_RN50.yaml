data:
    data_dir: "../../data/Algonauts23_shared_Net2Brain"
    stimuli_path: "../../data/Algonauts23_shared_Net2Brain/images"
    brain_rdms: "../../data/Algonauts23_shared_Net2Brain/brain_data"
    results_dir: "results/872_shared_total/"
    category: None

model:
    netset: "Clip"
    directory: "tmp/models/"
    name: "RN50"
    time_window: None 
    crop_size: None 
    center_crop: None 

feature_extraction:
    layers:
        - "visual.layer1"
        - "visual.layer2"
        - "visual.layer3"
        - "visual.layer4"

analysis:
    rsa:
        execute: True
        distance_metric: "spearman"
    reg: 
        execute: True
        n_folds: 3 # stick to net2brain defaults for now
        n_components: 100
        trn_tst_split: 0.8
        batch_size: 100


