data:
    data_dir: "../../data/Dwivedi2024EEG"
    stimuli_path: "../../data/Bonner2017/stimuli_data"
    brain_rdms: "../../data/Dwivedi2024EEG/rdms"
    results_dir: "results/Dwivedi2024EEG/"
    category: None

model:
    directory: "../../data/central_vision_ssl"
    netset: "cv_ssl"
    name: "vit_base"
    time_window: 0
    crop_size: 112
    center_crop: False

feature_extraction:
    layers:
        - "backbone.blocks.1"
        - "backbone.blocks.2"
        - "backbone.blocks.3"
        - "backbone.blocks.4"
        - "backbone.blocks.5"
        - "backbone.blocks.6"
        - "backbone.blocks.7"
        - "backbone.blocks.8"
        - "backbone.blocks.9"
        - "backbone.blocks.10"
        - "backbone.blocks.11"

analysis:
    rsa:
        execute: True
        distance_metric: "spearman"
        kwargs: {"timepoint_agg": False}
    reg: 
        execute: False
        n_folds: 3 # stick to net2brain defaults for now
        n_components: 100
        trn_tst_split: 0.8
        batch_size: 100


