data:
    data_dir: "../../data/BOLDmoments/fmri"
    stimuli_path: "../../data/BOLDmoments/stimuli_combined"
    brain_rdms: "../../data/BOLDmoments/rdms"
    results_dir: "results/BOLDmoments/Regression"
    category: None
model:
    directory: "../../data/central_vision_ssl"
    netset: cv_ssl
    name: resnet50
    time_window: 0
    crop_size: 112
    center_crop: False

feature_extraction:
    layers:
        - "backbone.layer4"
    extraction_kwargs: {"pick_frames": 5, "agg_frames": null}
    video: True
analysis:
    rsa:
        execute: True
        distance_metric: "spearman"
        kwargs: {}
    reg: 
        execute: False
        n_folds: 3 # stick to net2brain defaults for now
        n_components: 100
        trn_tst_split: 0.8
        custom_trn_tst: 1000
        batch_size: 100


