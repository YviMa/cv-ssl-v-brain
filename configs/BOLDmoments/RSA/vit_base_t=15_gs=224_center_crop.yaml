data:
    data_dir: "../../data/BOLDmoments"
    stimuli_path: "../../data/BOLDmoments/stimuli_combined"
    brain_rdms: "../../data/BOLDmoments/rdms"
    results_dir: "results/BOLDmoments/"
    category: None
model:
    directory: "../../data/central_vision_ssl"
    netset: cv_ssl
    name: vit_base
    time_window: 15
    crop_size: 224
    center_crop: True

feature_extraction:
    layers:
        - "backbone.blocks.1"
        - "backbone.blocks.2"
        - "backbone.blocks.3"
        - "backbone.blocks.4"
        - "backbone.blocks.5"
        - "backbone.blocks.6"
        - "backbone.blocks.7"
        - "backbone.blocks.8"
        - "backbone.blocks.9"
        - "backbone.blocks.10"
        - "backbone.blocks.11"
    extraction_kwargs: {"pick_frames": 5, "agg_frames": null}

analysis:
    rsa:
        execute: True
        distance_metric: "spearman"
        kwargs: {}
    reg: 
        execute: False
        n_folds: 3 # stick to net2brain defaults for now
        n_components: 100
        trn_tst_split: 0.8
        batch_size: 100


